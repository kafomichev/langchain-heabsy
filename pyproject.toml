[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-heabsy"
version = "0.1.0"
description = "LangChain chat model for Heabsy, an OpenAI-compatible inference API for open models"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Heabsy (FEYA, s.r.o.)" }]
requires-python = ">=3.9"
dependencies = [
  "langchain-openai>=1.3.1,<2.0.0",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://heabsy.com/platform"
Documentation = "https://heabsy.com/integrations/langchain"
"API reference" = "https://api.heabsy.com/docs"

[tool.setuptools.packages.find]
include = ["langchain_heabsy*"]
